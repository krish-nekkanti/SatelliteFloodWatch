<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>SATELLITE FLOODWATCH | Saving Lives From The Skies</title>
<link rel="stylesheet" href="style.css">
<style>
@property --c1 { syntax: '<color>'; inherits: true; initial-value: #0d1b2a; }
@property --c2 { syntax: '<color>'; inherits: true; initial-value: #1e3a60; }
@property --c3 { syntax: '<color>'; inherits: true; initial-value: #3b82f6; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Univers", "Univers LT Std", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(180deg, #eef9ff, #dfeeff 32%, #cfe6ff);
  color: #123b63;
  overflow-x: hidden;
}
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }

/* Nav */
.topbar {
  position: sticky; top: 0; min-height: 64px; padding: 0 26px; z-index: 1000;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  background: #000 !important;
  backdrop-filter: blur(8px) !important;
  border-bottom: 1px solid rgba(255,255,255,.15) !important;
  box-shadow: 0 14px 30px rgba(100,145,196,.08);
}
.brand { display: flex; align-items: center; gap: 0; text-decoration: none; color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 0; }
.brand span { color: #62d8f5; }
.site-nav { align-self: stretch; display: flex; align-items: center; gap: 27px; }
.site-nav a { display: inline-flex; align-items: center; min-height: 100%; border-bottom: 2px solid transparent; color: #fff; font-size: 12px; font-weight: 600; text-decoration: none; transition: color .2s ease, border-color .2s ease; }
.site-nav a:hover, .site-nav a.active { color: #fff; }

/* Stage */
.scroll-stage-wrapper { position: relative; height: 500vh; background: #03070d; transition: --c1 2s, --c2 2s, --c3 2s; }
.sticky-viewport { position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.sky-layer, .space-layer { position: absolute; inset: 0; transition: opacity .4s; }
.sky-layer { background: linear-gradient(180deg, #050b14, var(--c1) 40%, var(--c2) 70%, var(--c3)); }
.space-layer { background: radial-gradient(circle at 50% 30%, #081222, #020509); opacity: 0; }
.stars-far, .stars-near { position: absolute; inset: -50%; opacity: 0; pointer-events: none; transition: opacity .6s; }
.stars-far {
  background: radial-gradient(1px 1px at 30px 50px, rgba(255,255,255,.4), transparent),
              radial-gradient(1.5px 1.5px at 150px 120px, rgba(98,216,245,.5), transparent) 0 0/250px 250px;
}
.stars-near {
  background: radial-gradient(2px 2px at 80px 90px, #fff, transparent),
              radial-gradient(2.5px 2.5px at 200px 180px, #62d8f5, transparent) 0 0/350px 350px;
} 
.crossing-satellite {
  position: absolute; left: 0; width: 96px; height: 40px; opacity: 0; pointer-events: none;
  animation: satellite-crossing 18s linear infinite paused;
}
.crossing-satellite:nth-child(1) { top: 24%; }
.crossing-satellite:nth-child(2) { top: 62%; animation-duration: 24s; animation-delay: -12s; animation-direction: reverse; }
.sticky-viewport.first-panel-active .crossing-satellite { opacity: .9; animation-play-state: running; }
@keyframes satellite-crossing {
  from { transform: translateX(-120px) rotate(-12deg); }
  to { transform: translateX(calc(100vw + 120px)) rotate(-12deg); }
}
 
/* Pa nels */
.story-panel {
  position: absolute; left: 50%; width: calc(100% - 40px); max-width: 1400px; text-align: center; z-index: 20;
   opacity: 0; transform: translate(-50%, -40px); pointer-events: none;
   transition: opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
 }
.story-panel.active { opacity: 1; transform: translate(-50%, -70px); pointer-events: auto; }
#panel-5 { margin-top: 200px; }
.story-panel h2 { font-size: 42px; font-weight: 700; letter-spacing: -1px; line-height: 1.15; color: #fff; margin-bottom: 16px; }
.story-panel h2 span { color: #62d8f5; }
.story-logo { margin-bottom: 22px; color: #fff; font-size: 56px; font-weight: 700; line-height: 1; text-align: center; }
.story-logo span { color: #62d8f5; }
@media (max-width: 600px) { .story-logo { font-size: 36px; } }
.cta-btn {  
  position: relative; z-index: 30; display: inline-block; margin-top: 24px; padding: 14px 32px;
  background: #fff; color: #03070d; font-weight: 600; font-size: 14px; letter-spacing: .5px;
  text-decoration: none; border-radius: 6px; box-shadow: 0 10px 30px rgba(255,255,255,.2);
  transition: transform .2s, box-shadow .2s;
}
.cta-btn:hover { transform: scale(1.03); box-shadow: 0 10px 30px rgba(98,216,245,.3); }

/* Rocket */
.rocket-container {
  position: absolute; bottom: 12%; left: 50%; width: 104px; height: 208px; z-index: 10;
  transform: translateX(-50%); pointer-events: none; will-change: transform, opacity;
}
.flame-wrap { transform-origin: 50px 156px; transform: scaleY(var(--thrust, 1)); transition: transform .2s linear; }
.flame { transform-box: fill-box; transform-origin: 50% 0; animation: flick .1s ease-in-out infinite alternate; }
.f-mid { animation-duration: .08s; animation-direction: alternate-reverse; }
.f-inner { animation-duration: .06s; }
.f-core { animation-name: coreFlick; animation-duration: .09s; }
.flame-glow { animation: glowPulse .25s ease-in-out infinite alternate; }
.spark { opacity: 0; animation: sparkFall .7s linear infinite; }
.s1 { --dx: -9px; } .s2 { --dx: 8px; animation-delay: .18s; } .s3 { --dx: -6px; animation-delay: .35s; } .s4 { --dx: 10px; animation-delay: .52s; }
@keyframes flick { from { transform: scale(.92,.85) skewX(-3deg); } to { transform: scale(1.08,1.18) skewX(3deg); } }
@keyframes coreFlick { from { transform: scale(.9,.85); opacity: .85; } to { transform: scale(1.1,1.2); opacity: 1; } }
@keyframes glowPulse { from { opacity: .55; } to { opacity: .95; } }
@keyframes sparkFall { from { opacity: 1; } to { opacity: 0; transform: translate(var(--dx), 55px); } }

/* Globe + satellite */
.satellites-container {
  position: absolute; top: 25%; left: 50%; width: min(380px, 92vw); z-index: 10;
  transform: translate(-50%, -50%) scale(.4); opacity: 0; pointer-events: none; will-change: transform, opacity;
}
.satellites-container svg { display: block; width: 100%; height: auto; overflow: visible; }
.land { animation: globeSpin 26s linear infinite; }
.clouds { animation: globeSpin 17s linear infinite; }
.led { animation: ledBlink 1s steps(2) infinite; }
.beam { animation: beamDash .5s linear infinite; }
@keyframes globeSpin { to { transform: translateX(180px); } }
@keyframes ledBlink { 50% { opacity: .15; } }
@keyframes beamDash { to { stroke-dashoffset: -14; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* Footer */
.app-footer {
  position: relative; z-index: 100; background: #03070d; padding: 30px 40px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid rgba(255,255,255,.1); font-size: 11px; letter-spacing: 1px; color: #64748b;
}
</style>
</head>

<body>

    <a class="brand" href="index.html">SATELLITE <span>FLOODWATCH</span></a>
    <nav class="site-nav">
      <a class="active" href="index.html">Home</a>

            <circle class="spark s3" cx="50" cy="168" r="1.8" fill="#fff59d"/>
            <circle class="spark s4" cx="44" cy="174" r="1.2" fill="#ff7043"/>
          </g>
          <path d="M38 150 L62 150 L58 158 L42 158 Z" fill="#1d3044" stroke="#1d3044" stroke-width="2"/>
          <path d="M50 10 C30 40 30 120 30 150 L70 150 C70 120 70 40 50 10 Z" fill="#fff" stroke="#1d3044" stroke-width="2"/>
          <path d="M50 10 C40 25 30 40 30 40 L70 40 C70 40 60 25 50 10 Z" fill="#ff5252"/>
          <circle cx="50" cy="75" r="9" fill="#07111f" stroke="#62d8f5" stroke-width="2.5"/>

      </div>

      <div class="satellites-container" id="satellites">

              <path d="M150 150 C158 146 170 152 168 164 C166 176 154 180 148 170 C144 162 144 154 150 150 Z"/>
              <path d="M262 108 C270 104 280 110 278 120 C274 126 264 124 262 118 Z"/>
            </g>
            <g id="cloudTile">
              <ellipse cx="150" cy="85" rx="22" ry="5"/><ellipse cx="235" cy="120" rx="26" ry="6"/>
              <ellipse cx="180" cy="165" rx="20" ry="4.5"/><ellipse cx="265" cy="75" rx="15" ry="4"/>

          <g transform="rotate(-16 200 130)">
            <path d="M30 130 A170 40 0 0 1 370 130" fill="none" stroke="#62d8f5" stroke-opacity=".28" stroke-width="1.2" stroke-dasharray="4 5"/>

          <g transform="rotate(-16 200 130)">

<script>
const $ = id => document.getElementById(id);
const wrapper = $('scroll-wrapper'), sky = $('sky'), space = $('space'),
      starsFar = $('starsFar'), starsNear = $('starsNear'),
      rocket = $('rocket'), sats = $('satellites');
const panels = [...document.querySelectorAll('.story-panel')];
const stickyViewport = wrapper.querySelector('.sticky-viewport');
const clamp = n => Math.min(1, Math.max(0, n));

function update() {
  const p = clamp(-wrapper.getBoundingClientRect().top / (wrapper.offsetHeight - innerHeight));
  const t1 = clamp((p - 0.3) / 0.3);   // sky -> space
  const t2 = clamp((p - 0.6) / 0.22);  // rocket out, globe in

  const step = Math.min(Math.floor(p * 5), 4);
  stickyViewport.classList.toggle('first-panel-active', step === 0);
  panels.forEach(el => el.classList.toggle('active', +el.dataset.step === step));

  sky.style.opacity = 1 - t1;
  space.style.opacity = t1;
  starsFar.style.opacity = p < 0.6 ? t1 * 0.7 : 1;
  starsNear.style.opacity = t1;
  starsFar.style.transform = `translateY(${t1 * -40}px)`;
  starsNear.style.transform = `translateY(${t1 * -80}px)`;

  const y = (p < 0.3 ? -p * 500 : p < 0.6 ? -150 - t1 * 450 : -600 - t2 * 350) * 1.5;
  const scale = p < 0.6 ? 1 - t1 * 0.25 : 0.75;
  rocket.style.setProperty('--thrust', p < 0.6 ? 0.8 + p * 0.9 : 0.5);
  rocket.style.opacity = Math.min(p * 8, 1) * (1 - t2);
  rocket.style.transform = `translateX(-50%) translateY(${y}px) rotate(${t2 * 60}deg) scale(${scale})`;

  sats.style.opacity = t2;
  sats.style.transform = `translate(-50%, -50%) scale(${0.75 + t2 * 0.25})`;
}

let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { update(); ticking = false; });
}, { passive: true });
update();

/* Satellite orbit */
const sat = $('sat'), satBack = $('satBack'), satFront = $('satFront'), beam = $('beam');
const CX = 200, CY = 130, A = 170, B = 40;
let angle = 0, last = performance.now();

function orbit(now) {
  angle += Math.min((now - last) / 1000, 0.1) * 0.55;
  last = now;

  const s = Math.sin(angle);
  const x = CX - A * Math.cos(angle);
  const y = CY + B * s;
  const front = s > 0;

  sat.setAttribute('transform', `translate(${x} ${y}) scale(${0.4 + 0.18 * (0.5 + 0.5 * s)})`);
  const layer = front ? satFront : satBack;
  if (sat.parentNode !== layer) layer.appendChild(sat);

  beam.setAttribute('opacity', front ? 0.8 : 0);
  if (front) {
    beam.setAttribute('x1', x);
    beam.setAttribute('y1', y + 8);
    beam.setAttribute('x2', x + (CX - x) * 0.52);
    beam.setAttribute('y2', y + (CY - y) * 0.52);
  }
  requestAnimationFrame(orbit);
}
requestAnimationFrame(orbit);

/* Sky gradient palettes, every 3s */
const palettes = [
  ['#0d1b2a', '#1e3a60', '#3b82f6'],
  ['#1a0f2e', '#4a1d6b', '#c026d3'],
  ['#0b2a2a', '#0f5c5c', '#14b8a6'],
  ['#2a1408', '#7a2e12', '#f97316'],
  ['#0f1f2e', '#1d4f6b', '#38bdf8']
];
let i = 0;
setInterval(() => {
  i = (i + 1) % palettes.length;
  palettes[i].forEach((c, n) => wrapper.style.setProperty(`--c${n + 1}`, c));
}, 3000);
</script>
